services:
  korlassync:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: korlassync
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    networks:
      - n8n_default
      - openwa-network
    environment:
      APP_NAME: KorlasSync
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: https://marahub.ruffe-augmented.ts.net/korlassync
      ASSET_URL: https://marahub.ruffe-augmented.ts.net/korlassync
      APP_LOCALE: id
      APP_FALLBACK_LOCALE: en
      APP_TIMEZONE: Asia/Jakarta
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: n8n-postgres
      DB_PORT: "5432"
      DB_DATABASE: n8n_chat_memory
      DB_USERNAME: n8n
      DB_PASSWORD: ${DB_PASSWORD:-}
      OPENWA_URL: ${OPENWA_URL:-http://openwa-api:2785}
      OPENWA_API_KEY: ${OPENWA_API_KEY:-}
      OPENWA_SESSION_ID: ${OPENWA_SESSION_ID:-}
      N8N_REMINDER_WEBHOOK_URL: ${N8N_REMINDER_WEBHOOK_URL:-http://n8n:5678/webhook/reminder}
      SESSION_DRIVER: cookie
      SESSION_PATH: /korlassync
      SESSION_SECURE_COOKIE: "true"
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
    command: >
      sh -c "php artisan view:clear && php artisan view:cache &&
      exec frankenphp run --config /etc/frankenphp/Caddyfile"

networks:
  n8n_default:
    external: true
  openwa-network:
    external: true
